llm:
  max_concurrency: 5
  max_retries: 3
  timeout: 300
  providers:
    nova:
      base_url: http://token.njunova.com:8317/v1
      api_key_env: NOVA_API_KEY
      chunking_model: Kimi-K2.5
      peeling_model: MiniMax-M2.5
      skill_engine_model: MiniMax-M2.5
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
    qoder:
      base_url: https://sg.pigdaddy.xyz/v1
      api_key_env: QODER_API_KEY
      chunking_model: Qwen3.8-Max
      peeling_model: DeepSeek-Flash
      skill_engine_model: DeepSeek-Flash
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      chunking_model: deepseek-flash
      peeling_model: deepseek-flash
      skill_engine_model: deepseek-flash
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
  routers:
    chunking: qoder
    peeling: nova
    skillEngine: nova
mineru:
  api_mode: remote
  language: ch
  local:
    base_url: http://localhost:7860
    backend: vlm-auto-engine
    parse_method: auto
    formula_enable: true
    table_enable: true
  remote:
    model_version: vlm
    upload_mode: file
    page_ranges: ''
    is_ocr: false
    enable_formula: true
    enable_table: true
    extra_formats: []
paths:
  inputs_dir: inputs
  logs_dir: logs
  outputs_dir: outputs
  prompts_dir: prompts
pdf:
  chunk_merge_threshold: 5000
  chunk_min_threshold: 1000
  page_limit: 200
  request_interval: 0.3
