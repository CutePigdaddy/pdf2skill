llm:
  max_concurrency: 5
  max_retries: 3
  timeout: 300
  providers:
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      chunking_model: deepseek-ai/DeepSeek-R1
      peeling_model: deepseek-ai/DeepSeek-V3
      skill_engine_model: deepseek-ai/DeepSeek-V3
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
    google:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GOOGLE_API_KEY
      chunking_model: gemini-3-flash-preview
      peeling_model: gemini-3.1-flash-lite-preview
      skill_engine_model: gemini-3.1-flash-lite-preview
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      chunking_model: deepseek-chat
      peeling_model: deepseek-chat
      skill_engine_model: deepseek-chat
      chunking_reasoning_effort: ''
      peeling_reasoning_effort: ''
      skill_engine_reasoning_effort: ''
  # Web UI keys and CLI fallback keys are kept in sync.
  routers:
    chunking: siliconflow
    peeling: siliconflow
    skillEngine: siliconflow
    chunking_provider: siliconflow
    peeling_provider: siliconflow
    skill_engine_provider: siliconflow
mineru:
  api_mode: remote
  language: ch
  local:
    base_url: http://localhost:7860
    backend: vlm-auto-engine
    parse_method: auto
    formula_enable: true
    table_enable: true
  remote:
    model_version: vlm
    upload_mode: file
    page_ranges: ''
    is_ocr: false
    enable_formula: true
    enable_table: true
    extra_formats: []
paths:
  inputs_dir: inputs
  logs_dir: logs
  outputs_dir: outputs
  prompts_dir: prompts
pdf:
  chunk_merge_threshold: 5000
  chunk_min_threshold: 1000
  page_limit: 200
  request_interval: 0.3
